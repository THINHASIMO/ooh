<header id="siteHeader" [class.solid]="isSolid">
  <div class="wrap">
    <a routerLink="/" class="logo">
      <img [src]="logo" alt="NF OOH">
    </a>
    <nav id="siteNav" [class.open]="isMenuOpen">
      <ul>
        <li *ngFor="let item of navItems">
          <a
            *ngIf="!item.isAnchor"
            [routerLink]="item.href"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.href === '/' }"
            (click)="isMenuOpen = false"
          >{{ item.label }}</a>
          <a
            *ngIf="item.isAnchor"
            [href]="item.href"
            (click)="isMenuOpen = false"
          >{{ item.label }}</a>
        </li>
      </ul>
    </nav>
    <div class="nav-cta">
      <a href="tel:+0913567076" class="btn btn-outline on-dark">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E53935" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.29 6.29l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z"/>
        </svg>
        0913 567 076 - Nhận báo giá
      </a>
      <button class="burger" (click)="toggleMenu()" aria-label="Mở menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
