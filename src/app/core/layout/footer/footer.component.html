<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div class="col">
        <div class="footer-logo">
          <img [src]="logo" alt="NF OOH">
        </div>
        <p class="tagline">Agency quảng cáo ngoài trời — từ ý tưởng đến điểm chạm thật ngoài phố.</p>
        <div class="social">
          <a href="#" aria-label="Facebook">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </a>
          <a href="#" aria-label="Youtube">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.5 6.5s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.3-1C16.4 3 12 3 12 3h0s-4.4 0-7.3.2c-.4 0-1.4.1-2.3 1-.7.7-.9 2.3-.9 2.3S1 8.4 1 10.3v1.4c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.4.2 7.4.2s4.4 0 7.3-.2c.4 0 1.4-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8v-1.4c0-1.9-.2-3.8-.2-3.8zM9.7 14.6V7.9l6.5 3.4-6.5 3.3z"/></svg>
          </a>
          <a href="#" aria-label="Instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          </a>
        </div>
      </div>

      <div class="col">
        <h4>Điều hướng</h4>
        <ul>
          <li *ngFor="let link of navLinks">
            <a [href]="link.href">{{ link.label }}</a>
          </li>
        </ul>
      </div>

      <div class="col">
        <h4>Dịch vụ</h4>
        <ul>
          <li *ngFor="let svc of serviceLinks">
            <a [href]="svc.href">{{ svc.label }}</a>
          </li>
        </ul>
      </div>

      <div class="col">
        <h4>Liên hệ</h4>
        <ul class="foot-addr">
          <li>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Số 7 ngõ 196 Phố Thụy Khuê, Phường Thụy Khuê, Hà Nội
          </li>
          <li>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6.2 6.2l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>
            Hotline: {{ hotline }}
          </li>
          <li>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
            {{ email }}
          </li>
        </ul>
      </div>
    </div>

    <div class="bottom-bar">
      <span>© {{ currentYear }} NF OOH. Bảo lưu mọi quyền.</span>
      <span>NF OOH</span>
    </div>
  </div>
</footer>
